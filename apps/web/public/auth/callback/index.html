<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 처리 중...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    .container {
      text-align: center;
      padding: 24px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p { font-size: 15px; margin: 0; }
    .btn-close {
      margin-top: 16px;
      padding: 8px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <p id="msg">로그인 인증 처리 중입니다...</p>
    <a id="openAppBtn" href="#" style="display:none; margin-top:16px; display:none; padding:10px 20px; background:#3b82f6; color:white; text-decoration:none; border-radius:8px; font-weight:600; font-size:14px;">앱으로 돌아가기</a>
    <button class="btn-close" id="closeBtn" onclick="window.close()">창 닫기</button>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || params.get('auth_code');
      const state = params.get('state') || params.get('auth_state');
      const error = params.get('error') || params.get('auth_error');

      const payload = {
        type: 'OAUTH_CALLBACK',
        code: code,
        state: state,
        error: error,
        timestamp: Date.now()
      };

      console.log('[OAuth Callback] Processing callback:', payload);

      // 0. 모바일 환경(InAppBrowser / Custom Tab): 앱 딥링크로 즉시 복귀
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && (code || error)) {
        const deepLinkUrl = 'com.mobile://oauth/callback' + window.location.search;
        console.log('[OAuth Callback] Triggering deep link:', deepLinkUrl);
        const openAppBtn = document.getElementById('openAppBtn');
        if (openAppBtn) {
          openAppBtn.href = deepLinkUrl;
          openAppBtn.style.display = 'inline-block';
        }
        try {
          window.location.href = deepLinkUrl;
        } catch (e) {
          console.warn('Auto redirect to deep link failed:', e);
        }
      }

      // 1. BroadcastChannel 전송 (COOP 환경에서도 부모 창에 안전하게 전달)
      try {
        const bc = new BroadcastChannel('oauth_channel');
        bc.postMessage(payload);
        setTimeout(function() { try { bc.close(); } catch(e){} }, 1000);
      } catch (e) {
        console.warn('BroadcastChannel failed:', e);
      }

      // 2. localStorage 저장 (부모 창 폴링 및 storage 이벤트 감지용)
      try {
        localStorage.setItem('oauth_callback_data', JSON.stringify(payload));
      } catch (e) {
        console.warn('localStorage failed:', e);
      }

      // 3. postMessage (opener가 연결되어 있는 경우)
      if (window.opener) {
        try {
          window.opener.postMessage(payload, '*');
        } catch (e) {
          console.warn('postMessage failed:', e);
        }
      }

      // 4. 완료 UI 안내 및 팝업 닫기
      document.getElementById('msg').textContent = error 
        ? '로그인 중 오류가 발생했습니다. 이 창을 닫아주세요.' 
        : '인증이 완료되었습니다. 창이 곧 닫힙니다...';
      
      const closeBtn = document.getElementById('closeBtn');
      if (closeBtn && !isMobile) closeBtn.style.display = 'inline-block';

      // 5. 팝업 자동 닫기 시도 (웹 팝업일 때)
      if (!isMobile) {
        setTimeout(function() {
          try {
            window.close();
          } catch (e) {}
        }, 500);
      }
    })();
  </script>
</body>
</html>
