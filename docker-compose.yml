services:
  searxng:
    image: searxng/searxng:latest
    container_name: gemma4-searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-gemma4-omni-dev-secret-key}
    volumes:
      - ./apps/auth-server/searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
